# FastAPI's activation base. Namespace ownership remains with Terraform:
# INFRA/platform creates `apps` before ArgoCD syncs this path, so no Namespace
# resource is declared here.
#
# rbac must be included with the workload bases. All four Pod templates name
# ServiceAccount/fastapi-ai-node; omitting this base leaves those Pods pending
# (or silently switches them to the default ServiceAccount if the references
# are removed), breaking the minimal-RBAC contract.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - rbac
  - core
  - batch
  - policies

# Single point of image control. The five Pod templates under core/ and batch/
# keep a concrete reference so each base still renders standalone, but this
# override wins for anything ArgoCD applies, so a new build only needs the tag
# changed here rather than in five files.
#
# Keep newTag on the `main-<shortSHA>` form produced by the image build. Do not
# use a floating tag such as `latest`: with prune/selfHeal enabled a mutable
# tag makes the deployed revision unverifiable from Git alone.
images:
  - name: y0njunch0i/sellon-ai-node
    newTag: main-5d48a9a
