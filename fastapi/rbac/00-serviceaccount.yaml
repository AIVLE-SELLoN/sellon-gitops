# No Role/RoleBinding in this directory: none of the fastapi-ai-node
# workloads call the Kubernetes API. secretKeyRef/envFrom env injection
# (LLM_API_KEY, MQ_USER/MQ_PASSWORD, AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY,
# etc. — see fastapi/core, a sibling branch) is performed by the kubelet at
# Pod startup, not by the Pod calling the Secrets API itself, so it needs no
# RBAC grant at all. A Role/RoleBinding "just in case" would be an unused
# permission with nothing that actually exercises it.
#
# automountServiceAccountToken: false for the same reason, taken one step
# further: since nothing here calls the Kubernetes API, the SA token itself
# does not need to be mounted into the Pod filesystem. This is "minimal"
# RBAC applied literally to this ServiceAccount, not a separately requested
# feature bolted on.
#
# NO eks.amazonaws.com/role-arn annotation. IRSA was considered and
# rejected (2026-08-17) — not left open for future review. Two independent
# reasons, either sufficient on its own:
#   1. The AI repo's app/reporting/s3_uploader.py passes static keys
#      directly to its boto3 client instead of using the default
#      credential chain, and ensure_s3_ready() raises before upload if
#      those keys are empty. An IRSA-issued role has nothing to plug into
#      that code path.
#   2. More fundamentally: a SigV4 presigned URL stays valid only as long
#      as the credentials that signed it stay valid. IRSA's STS temporary
#      credentials cap out at a 12-hour role session, which cannot produce
#      the agreed 7-day presigned URL. This is not fixable by changing
#      s3_uploader.py — an STS session cannot be made to outlive itself.
# Static keys are therefore the only mechanism that satisfies the 7-day
# link. They are supplied by the fastapi-s3-credentials Secret (ESO-synced
# from sellon/fastapi/s3, owned by fastapi/core) — not created here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastapi-ai-node
automountServiceAccountToken: false
