# Daily reports use static credentials, not IRSA. SigV4 presigned URLs remain
# valid only while their signing credentials do; an IRSA STS session is at most
# 12 hours and cannot guarantee the agreed seven-day link. The AI uploader also
# passes these keys directly to boto3 instead of using the default chain.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fastapi-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: fastapi-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: sellon/fastapi/s3
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: sellon/fastapi/s3
        property: AWS_SECRET_ACCESS_KEY
