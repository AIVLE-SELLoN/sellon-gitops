# This base is deliberately activation-free: apps/fastapi.yaml and the
# top-level fastapi kustomization are added only when the service is ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - 00-web-config.yaml
  - 01-consumer-config.yaml
  - 02-web-deployment.yaml
  - 03-web-service.yaml
  - 04-consumer-deployment.yaml
  - 10-llm-external-secret.yaml
  - 11-s3-external-secret.yaml
  - 12-raw-db-configmap.yaml
  - 13-raw-db-external-secret.yaml

# Every FastAPI workload added under this base must share these selector-safe
# labels so Services, Deployments, Jobs, and monitoring use one identity.
labels:
  - pairs:
      app: fastapi-ai-node
      app.kubernetes.io/name: fastapi-ai-node
    includeSelectors: true
