# raw-db 마스터 자격증명은 data 스택이 manage_master_user_password로 AWS에
# 자동 생성·관리합니다(rds!db-... 시크릿, username/password 두 키만 있음).
# 이 저장소는 그 시크릿을 읽기만 하고 값이나 ARN을 새로 만들지 않습니다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: raw-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: raw-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: RAW_DB_USERNAME
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-2acd7301-4fc5-45c8-9eaf-736cf1a6d944-ubKdF5
        property: username
    - secretKey: RAW_DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-2acd7301-4fc5-45c8-9eaf-736cf1a6d944-ubKdF5
        property: password
