# Open items — do not resolve arbitrarily, see fastapi/core/INPUTS.md:
#   - image: full Docker Hub namespace is unknown; placeholder below.
#   - command: image default CMD is unverified (no Dockerfile in this repo).
#     Do not override unless confirmed the image's default CMD does not
#     already start uvicorn on 0.0.0.0:8080 with the correct module path.
#   - securityContext.runAsNonRoot: not set because it is unverified whether
#     the image actually runs as a non-root user (no Dockerfile USER seen).
#     Setting it without confirmation risks CreateContainerConfigError.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ai-node-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-ai-node
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-ai-node
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: web
          image: <DOCKERHUB_NAMESPACE>/sellon-ai-node:main-<shortSHA>
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fastapi-ai-node-web-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fastapi-llm-credentials
                  key: LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
