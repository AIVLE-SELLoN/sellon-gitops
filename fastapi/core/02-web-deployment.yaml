# Open items — do not resolve arbitrarily, see fastapi/core/INPUTS.md:
#   - image: full Docker Hub namespace is unknown; placeholder below.
#
# Resolved by reading the AI source repo's Dockerfile directly:
#   - command: intentionally NOT set. The image's default CMD is already
#     ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"],
#     so overriding it here would duplicate the entrypoint in two places
#     that can drift apart on the next image update.
#   - securityContext.runAsNonRoot: intentionally NOT set. The Dockerfile
#     has no USER instruction, so the container runs as root; setting
#     runAsNonRoot: true would fail with CreateContainerConfigError.
#
# startupProbe permits up to 150 seconds (5 seconds x 30 attempts) because
# the actual cold-start time has not yet been measured. It is used instead of
# a long initialDelaySeconds so liveness monitoring resumes immediately after
# successful startup rather than leaving the same delay as a monitoring gap.
# Measure the actual startup time after deployment and tune failureThreshold.
#
# serviceAccountName references the ServiceAccount declared in
# fastapi/rbac (a sibling branch) — not owned or created here. That SA sets
# automountServiceAccountToken: false because no workload calls the
# Kubernetes API. Without this line the Pod silently falls back to the
# namespace's `default` SA, which DOES mount a token, quietly undoing that
# minimal-RBAC guarantee. The SA must exist before this Deployment is
# applied — a missing serviceAccountName target blocks Pod creation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ai-node-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fastapi-ai-node
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastapi-ai-node
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: fastapi-ai-node
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: web
          image: <DOCKERHUB_NAMESPACE>/sellon-ai-node:main-<shortSHA>
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fastapi-ai-node-web-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fastapi-llm-credentials
                  key: LLM_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
