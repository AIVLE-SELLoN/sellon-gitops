# RDS master credentials rotate in place. Consume username/password directly
# from that secret; copying the password to another Secrets Manager secret
# would diverge after the first rotation. The namespace is supplied by this
# base's kustomization.yaml (`namespace: apps`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fastapi-raw-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: fastapi-raw-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: RAW_DB_USERNAME
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-2acd7301-4fc5-45c8-9eaf-736cf1a6d944-ubKdF5
        property: username
    - secretKey: RAW_DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-2acd7301-4fc5-45c8-9eaf-736cf1a6d944-ubKdF5
        property: password
