# The shared ClusterSecretStore is owned by the common-resources PR. This
# service only consumes it; AWS credentials and a store definition do not
# belong under fastapi/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fastapi-llm-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: fastapi-llm-credentials
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: sellon/fastapi/llm
        property: LLM_API_KEY
