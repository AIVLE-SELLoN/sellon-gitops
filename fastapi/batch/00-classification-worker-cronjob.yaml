# Deployment gates closed on 2026-08-20 — see fastapi/batch/INPUTS.md for the
# full history. Summary:
#   - image: the tag is set centrally in fastapi/kustomization.yaml's `images`
#     block, which overrides the reference below for anything ArgoCD applies.
#   - The `scripts/` blocker is closed: `docker run --rm <image> ls -la
#     /app/scripts` on main-9cb5baa lists classification_worker.py (67567
#     bytes) alongside the prompts/ directory, so the entrypoint this CronJob
#     invokes is present in the published image.
#   - Raw PostgreSQL connection: confirmed — same contract as daily-batch
#     (RAW_DB_HOST/RAW_DB_PORT/RAW_DB_NAME/RAW_DB_SSLMODE from ConfigMap
#     fastapi-ai-node-raw-db-config + RAW_DB_USERNAME/RAW_DB_PASSWORD from
#     the fastapi-raw-db-credentials Secret), not a single DSN.
#   - AI code Postgres support: AI team confirmed raw DB access is migrating
#     from SQLite to PostgreSQL (was previously a blocker; see
#     fastapi/batch/INPUTS.md "AI code Postgres support" for detail).
#   - requests/limits below are still ESTIMATES. The first scheduled run is
#     the measurement opportunity; revise them from observed usage rather
#     than leaving the estimate in place indefinitely.
#   - suspend: false — released now that the scripts/ blocker above is closed.
#     daily-batch has already completed a real scheduled run on this cluster,
#     which exercises the same image, ServiceAccount, and raw DB contract.
#
# spec.jobTemplate.spec.template.metadata.labels MUST include
# app=fastapi-ai-node (see fastapi/batch/INPUTS.md "Critical labeling
# contract" — platform ChromaDB NetworkPolicy reasoning). Hardcoded here in
# addition to the kustomize `labels` transformer for the same
# belt-and-suspenders reason as the rest of this directory, even though this
# workload does not talk to ChromaDB (see below).
#
# serviceAccountName references the ServiceAccount declared in fastapi/rbac
# (a sibling branch) — not owned or created here. Without it the Pod falls
# back to the namespace's `default` ServiceAccount, which mounts a
# Kubernetes API token this workload never uses. Note the nesting: on a
# CronJob this belongs under spec.jobTemplate.spec.template.spec, not at the
# CronJob's own spec level.
#
# MQ/Chroma/S3 env/config are deliberately NOT wired into this workload —
# explicit instruction for this CronJob, superseding the earlier inference
# in fastapi/batch/INPUTS.md that it "likely" needed ChromaDB access.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fastapi-ai-node-classification-worker
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid

  # Suspended: the image namespace is resolved, but the `scripts/` Dockerfile
  # PR merge and the linux/amd64 image push are still unverified. This
  # workload runs `python scripts/classification_worker.py`, so an image
  # without `scripts/` fails every scheduled run. Flip to false once those
  # two blockers in INPUTS.md "Classification Worker — not deployment-ready"
  # are closed.
  suspend: false
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: fastapi-ai-node
            app.kubernetes.io/name: fastapi-ai-node
            app.kubernetes.io/component: classification-worker
        spec:
          # Job/CronJob pod templates reject restartPolicy: Always (the
          # implicit Pod default); OnFailure is the conventional choice for
          # batch workloads and is what `kubectl create cronjob` defaults to.
          restartPolicy: OnFailure
          serviceAccountName: fastapi-ai-node
          imagePullSecrets:
            - name: dockerhub-pull-secret
          containers:
            - name: classification-worker
              image: y0njunch0i/sellon-ai-node:main-6e7b1b1
              command: ["python", "scripts/classification_worker.py"]
              env:
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fastapi-llm-credentials
                      key: LLM_API_KEY
                # Mirrors the LOG_LEVEL: INFO value already established in
                # fastapi-ai-node-web-config / fastapi-ai-node-consumer-config
                # (fastapi/core). No batch-owned ConfigMap exists for this
                # single key, so it is set directly here.
                - name: LOG_LEVEL
                  value: INFO
                # RDS master credentials rotate in place. This Secret is
                # synchronized directly from that master secret by ESO;
                # do not copy its password to a second secret.
                - name: RAW_DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: fastapi-raw-db-credentials
                      key: RAW_DB_USERNAME
                - name: RAW_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: fastapi-raw-db-credentials
                      key: RAW_DB_PASSWORD
              envFrom:
                # Supplies RAW_DB_HOST/PORT/NAME/SSLMODE. The container has
                # no RAW_DB_DSN because the AI source rejects that legacy key.
                - configMapRef:
                    name: fastapi-ai-node-raw-db-config
              # Estimated, not measured — see fastapi/batch/INPUTS.md.
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
