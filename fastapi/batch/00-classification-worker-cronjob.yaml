# NOT DEPLOYMENT-READY — see fastapi/batch/INPUTS.md "Classification Worker
# — not deployment-ready" for the full list. Do not mark this workload
# deployable until every item there is closed. Summary:
#   - image: Docker Hub namespace placeholder unresolved (same as elsewhere).
#   - The `scripts/` Dockerfile PR's merge status and whether a linux/amd64
#     production image was actually pushed are UNVERIFIED from this
#     GitOps repo/session — no access to that PR or the registry here.
#   - Raw PostgreSQL connection: confirmed — split 5-var contract
#     (RAW_DB_HOST/RAW_DB_PORT/RAW_DB_NAME literals + RAW_DB_USERNAME/
#     RAW_DB_PASSWORD from the raw-db-credentials Secret), not a single DSN.
#   - Per fastapi/core/INPUTS.md "Raw DB input gate": the AI code is still
#     SQLite-only, so this CronJob must not be activated even with the above
#     confirmed — Postgres support must land in the AI code first.
#   - requests/limits below are ESTIMATES, not measured or confirmed values.
#
# spec.jobTemplate.spec.template.metadata.labels MUST include
# app=fastapi-ai-node (see fastapi/batch/INPUTS.md "Critical labeling
# contract" — platform ChromaDB NetworkPolicy reasoning). Hardcoded here in
# addition to the kustomize `labels` transformer for the same
# belt-and-suspenders reason as the rest of this directory, even though this
# workload does not talk to ChromaDB (see below).
#
# serviceAccountName references the ServiceAccount declared in fastapi/rbac
# (a sibling branch) — not owned or created here. Without it the Pod falls
# back to the namespace's `default` ServiceAccount, which mounts a
# Kubernetes API token this workload never uses. Note the nesting: on a
# CronJob this belongs under spec.jobTemplate.spec.template.spec, not at the
# CronJob's own spec level.
#
# MQ/Chroma/S3 env/config are deliberately NOT wired into this workload —
# explicit instruction for this CronJob, superseding the earlier inference
# in fastapi/batch/INPUTS.md that it "likely" needed ChromaDB access.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fastapi-ai-node-classification-worker
spec:
  schedule: "0 2 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: fastapi-ai-node
            app.kubernetes.io/name: fastapi-ai-node
            app.kubernetes.io/component: classification-worker
        spec:
          # Job/CronJob pod templates reject restartPolicy: Always (the
          # implicit Pod default); OnFailure is the conventional choice for
          # batch workloads and is what `kubectl create cronjob` defaults to.
          restartPolicy: OnFailure
          serviceAccountName: fastapi-ai-node
          imagePullSecrets:
            - name: dockerhub-pull-secret
          containers:
            - name: classification-worker
              image: <DOCKERHUB_NAMESPACE>/sellon-ai-node:main-<shortSHA>
              command: ["python", "scripts/classification_worker.py"]
              env:
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: fastapi-llm-credentials
                      key: LLM_API_KEY
                # Mirrors the LOG_LEVEL: INFO value already established in
                # fastapi-ai-node-web-config / fastapi-ai-node-consumer-config
                # (fastapi/core). No batch-owned ConfigMap exists for this
                # single key, so it is set directly here.
                - name: LOG_LEVEL
                  value: INFO
                # Raw PostgreSQL connection — confirmed as a split 5-var
                # contract (host/port/name literals + username/password from
                # the raw-db-credentials Secret), not a single DSN.
                - name: RAW_DB_HOST
                  value: sellon-raw-db.ctsuua8qwvjg.ap-northeast-2.rds.amazonaws.com
                - name: RAW_DB_PORT
                  value: "5432"
                - name: RAW_DB_NAME
                  value: rawdb
                - name: RAW_DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: raw-db-credentials
                      key: RAW_DB_USERNAME
                - name: RAW_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: raw-db-credentials
                      key: RAW_DB_PASSWORD
              # Estimated, not measured — see fastapi/batch/INPUTS.md.
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
