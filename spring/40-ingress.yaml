# The HTTPS listener keeps using the platform ACM certificate. Its concrete
# ARN comes from INFRA/platform's acm_certificate_arn output and is not stored
# in this repository; activation stays blocked until INPUTS.md is resolved.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-backend
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ClusterIP Services require pod IP targets; instance targets require a
    # NodePort Service and would not route to this Service.
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP:80 must be listed. ssl-redirect installs its redirect as the default
    # action of every HTTP listener, so with an HTTPS-only listener list there is
    # no listener to carry it and port 80 is simply refused. network/
    # security_groups.tf already opens 80 on sg-alb for this redirect.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: <ACM_CERTIFICATE_ARN>
    # The default ALB health-check path is /, which Spring Security protects.
    # Keep this aligned with the unauthenticated Pod readiness probe: the ALB
    # should drain a target whose dependencies are not ready.
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - host: app.sellon.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spring-backend
                port:
                  name: http
