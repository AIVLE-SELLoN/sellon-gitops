# Activation-free base: apps/spring.yaml is deliberately not created in this
# change. This directory can be rendered and reviewed before ArgoCD owns it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - 00-config.yaml
  - 10-external-secret.yaml
  - 20-service-account.yaml
  - 30-deployment.yaml
  - 31-service.yaml
  - 40-ingress.yaml
  - 50-network-policy.yaml

labels:
  - pairs:
      app: spring-backend
      app.kubernetes.io/name: spring-backend
    # NetworkPolicy contains both its own target selector and peer selectors
    # (notably kube-dns). Kustomize selector transformation would add this
    # service's labels to the CoreDNS peer and silently block DNS. Workload
    # selectors are therefore written explicitly in their manifests.
    includeSelectors: false

# Single point of image control, matching fastapi/kustomization.yaml. Only one
# Pod template exists here today, but keeping the tag in the same place for
# both services means a rollback follows one procedure rather than two.
#
# Note the tag form: this repository publishes Spring as a bare short SHA,
# unlike sellon-ai-node's `main-<shortSHA>`. Do not add the prefix by analogy —
# `main-04e6a78` does not exist and yields ImagePullBackOff.
images:
  - name: y0njunch0i/sellon-spring-node
    newTag: 9ca75b0
