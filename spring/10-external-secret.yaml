# The shared ClusterSecretStore is owned by common/. This service only
# consumes it: AWS credentials, Secrets Manager values, and the Store
# definition do not belong under spring/.
#
# sellon/spring-backend/application is a name-and-JSON-key contract only.
# The Secrets Manager secret has not been provisioned yet; INPUTS.md records
# the required keys before this manifest is activated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spring-backend-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: spring-backend-credentials
    creationPolicy: Owner
  data:
    - secretKey: SMTP_USER
      remoteRef:
        key: sellon/spring-backend/application
        property: SMTP_USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: sellon/spring-backend/application
        property: SMTP_PASSWORD
    - secretKey: AWS_S3_REPORT_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_REPORT_ACCESS_KEY
    - secretKey: AWS_S3_REPORT_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_REPORT_SECRET_KEY
    - secretKey: AWS_S3_IMAGE_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_IMAGE_ACCESS_KEY
    - secretKey: AWS_S3_IMAGE_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_IMAGE_SECRET_KEY
    # application.yaml references cloud.aws.credentials.access-key /
    # secret-key with no default. They are loaded under the prod profile too,
    # so omitting them breaks property binding at startup.
    - secretKey: AWS_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_ACCESS_KEY
    - secretKey: AWS_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_SECRET_KEY
    # Base64-encoded key material, decoded by the application before use.
    - secretKey: JWT_SECRET
      remoteRef:
        key: sellon/spring-backend/application
        property: JWT_SECRET
    - secretKey: CURSOR_SECRET
      remoteRef:
        key: sellon/spring-backend/application
        property: CURSOR_SECRET
---
# ElastiCache has transit encryption enabled, so application-prod.yaml sets
# spring.data.redis.password and ssl.enabled: true. Without this Secret the
# connection is refused and startup fails on the property placeholder.
#
# The secret is owned by the data stack (data/elasticache.tf) and holds a JSON
# object with a single auth_token key, not a bare string — hence the property
# selector below. Its ARN is already in platform/irsa.tf, so ESO needs no
# Terraform change to read it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spring-backend-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: spring-backend-redis
    creationPolicy: Owner
  data:
    - secretKey: REDIS_AUTH_TOKEN
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:sellon/elasticache/redis/auth-token-PaY0ue
        property: auth_token
---
# svc-db and raw-db credentials are NOT copied into the application secret.
# Both instances are provisioned with an RDS-managed master user secret
# (data/rds.tf, master_user_secret), and raw-db additionally has
# aws_secretsmanager_secret_rotation attached. A hand-maintained copy would
# silently diverge from the live password at the next rotation, so these two
# ExternalSecrets read the managed secrets directly. Their JSON keys are the
# RDS-fixed `username` / `password`.
#
# platform/irsa.tf already grants ESO svc_db_secret_arn and raw_db_secret_arn,
# so no Terraform change is required for these two. The application secret
# above still needs its ARN added to that policy - see INPUTS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spring-backend-svc-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: spring-backend-svc-db
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-9233c391-f506-43d7-aa1d-aadba90c1404-aenRHD
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-9233c391-f506-43d7-aa1d-aadba90c1404-aenRHD
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spring-backend-raw-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: spring-backend-raw-db
    creationPolicy: Owner
  data:
    - secretKey: RAW_DB_USERNAME
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-2acd7301-4fc5-45c8-9eaf-736cf1a6d944-ubKdF5
        property: username
    - secretKey: RAW_DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-2:337658133748:secret:rds!db-2acd7301-4fc5-45c8-9eaf-736cf1a6d944-ubKdF5
        property: password
