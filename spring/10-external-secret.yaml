# The shared ClusterSecretStore is owned by common/. This service only
# consumes it: AWS credentials, Secrets Manager values, and the Store
# definition do not belong under spring/.
#
# sellon/spring-backend/application is a name-and-JSON-key contract only.
# The Secrets Manager secret has not been provisioned yet; INPUTS.md records
# the required keys before this manifest is activated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spring-backend-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: sellon-aws-secrets-manager
  target:
    name: spring-backend-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_URL
      remoteRef:
        key: sellon/spring-backend/application
        property: DB_URL
    - secretKey: DB_USERNAME
      remoteRef:
        key: sellon/spring-backend/application
        property: DB_USERNAME
    - secretKey: DB_PASSWORD
      remoteRef:
        key: sellon/spring-backend/application
        property: DB_PASSWORD
    - secretKey: SMTP_USER
      remoteRef:
        key: sellon/spring-backend/application
        property: SMTP_USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: sellon/spring-backend/application
        property: SMTP_PASSWORD
    - secretKey: AWS_S3_REPORT_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_REPORT_ACCESS_KEY
    - secretKey: AWS_S3_REPORT_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_REPORT_SECRET_KEY
    - secretKey: AWS_S3_IMAGE_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_IMAGE_ACCESS_KEY
    - secretKey: AWS_S3_IMAGE_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_S3_IMAGE_SECRET_KEY
    - secretKey: RAW_DB_URL
      remoteRef:
        key: sellon/spring-backend/application
        property: RAW_DB_URL
    - secretKey: RAW_DB_USERNAME
      remoteRef:
        key: sellon/spring-backend/application
        property: RAW_DB_USERNAME
    - secretKey: RAW_DB_PASSWORD
      remoteRef:
        key: sellon/spring-backend/application
        property: RAW_DB_PASSWORD
    # application.yaml references cloud.aws.credentials.access-key /
    # secret-key with no default. They are loaded under the prod profile too,
    # so omitting them breaks property binding at startup.
    - secretKey: AWS_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_ACCESS_KEY
    - secretKey: AWS_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_SECRET_KEY
    - secretKey: AWS_OPENSEARCH_ACCESS_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_OPENSEARCH_ACCESS_KEY
    - secretKey: AWS_OPENSEARCH_SECRET_KEY
      remoteRef:
        key: sellon/spring-backend/application
        property: AWS_OPENSEARCH_SECRET_KEY
