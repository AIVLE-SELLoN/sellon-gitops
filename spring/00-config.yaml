apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-backend-config
data:
  # application.yaml defaults to the local profile. Without this override the
  # production container silently starts with the local configuration instead
  # of application-prod.yaml.
  SPRING_PROFILES_ACTIVE: prod

  # Both RDS instances use an RDS-managed master user secret, whose JSON holds
  # only username/password. The connection URL is not in Secrets Manager and is
  # not secret, so it belongs here. Endpoints are host:port.
  DB_URL: jdbc:postgresql://sellon-svc-db.ctsuua8qwvjg.ap-northeast-2.rds.amazonaws.com:5432/svcdb
  RAW_DB_URL: jdbc:postgresql://sellon-raw-db.ctsuua8qwvjg.ap-northeast-2.rds.amazonaws.com:5432/rawdb

  # ElastiCache primary (writer) endpoint. The reader endpoint is not used:
  # application-prod.yaml configures a single spring.data.redis.host.
  REDIS_HOST: master.sellon-redis.4vrzam.apn2.cache.amazonaws.com
  REDIS_PORT: "6379"

  # RabbitMQ is in default, not apps. A short service name would resolve to
  # apps, so the cluster FQDN is required.
  RABBITMQ_HOST: rabbitmq.default.svc.cluster.local
  RABBITMQ_PORT: "5672"

  # The queues live in the app vhost. application-prod.yaml does not set
  # spring.rabbitmq.virtual-host, so Spring would otherwise connect to the
  # default "/" vhost, start healthy, and silently receive nothing.
  SPRING_RABBITMQ_VIRTUAL_HOST: app

  AWS_S3_REPORT_BUCKET: sellon-reports-dev-337658133748-ap-northeast-2-an
  AWS_S3_IMAGE_BUCKET: sellon-images-dev-337658133748-ap-northeast-2-an

  # application-prod.yaml drops the local default (localhost:8000) and requires
  # this, so that a missing value fails at startup instead of quietly pointing
  # production at a developer machine. FastAPI's Service is ClusterIP-only, so
  # this is the in-cluster address rather than a public URL. Both services sit
  # in apps, but the FQDN is used for symmetry with the RabbitMQ entry above.
  AI_SERVICE_BASE_URL: http://fastapi-ai-node-web.apps.svc.cluster.local:8080
