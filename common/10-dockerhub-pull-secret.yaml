# The Secrets Manager source holds only username and password. ESO assembles
# the Docker config in the target Secret; keeping the target type is required
# for kubelet to use it as an image pull credential.
#
# The source identifier is the platform-owned Docker Hub contract. Do not
# replace it with an ARN or put any credential value in this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-pull-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sellon-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dockerhub-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: sellon/dockerhub
        property: username
    - secretKey: password
      remoteRef:
        key: sellon/dockerhub
        property: password
---
# Kubernetes Secrets are namespace-scoped. ChromaDB runs in default, so the
# same target name must be materialized independently in that namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-pull-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: sellon-aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: dockerhub-pull-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: sellon/dockerhub
        property: username
    - secretKey: password
      remoteRef:
        key: sellon/dockerhub
        property: password
