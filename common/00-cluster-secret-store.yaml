# This is a ClusterSecretStore because the shared pull secret is required in
# both apps and default. A namespaced SecretStore cannot serve both namespaces.
# The referenced ServiceAccount is created and annotated for IRSA by
# INFRA/platform; no AWS access keys or role ARN belong in this repository.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: sellon-aws-secrets-manager
spec:
  # Limit this cluster-scoped Store to the namespaces that currently consume
  # shared credentials. Add a namespace here only with its owning service PR.
  conditions:
    - namespaces:
        - apps
        - default
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
