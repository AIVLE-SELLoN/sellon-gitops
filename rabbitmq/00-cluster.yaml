# RabbitMQ 클러스터 본체.
#
# 이전에는 platform 스택이 kubernetes_stateful_set_v1로 단일 파드 RabbitMQ를
# 띄웠지만, CRD 문서의 큐/바인딩이 rabbitmqClusterReference로 이 리소스를
# 가리키기 때문에 오퍼레이터가 관리하는 RabbitmqCluster로 교체했습니다.
# 자세한 배경은 platform/k8s_rabbitmq.tf 주석 참고.
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: rabbitmq
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Queue/Vhost와 달리 RabbitmqCluster CRD에는 deletionPolicy 필드가 없어서
    # 삭제 보호를 ArgoCD 레벨에서 겁니다. 클러스터가 지워지면 StatefulSet과
    # PVC까지 함께 날아가고, gp3 StorageClass가 reclaim_policy = "Delete"
    # (platform/k8s_storage.tf)라 EBS 볼륨 자체가 삭제됩니다. 그 시점엔 큐에
    # 걸어둔 deletionPolicy: retain 도 무의미합니다 — 데이터가 있던 디스크가
    # 사라졌으니까요.
    #
    # 두 옵션이 서로 다른 경로를 막습니다. 하나만 걸면 나머지 구멍이 남습니다:
    #   Prune=false  이 Application을 sync할 때 이 파일이 없어졌다고 지우는 것을 막음
    #   Delete=false 이 Application 자체가 삭제될 때의 cascade 삭제를 막음
    #
    # 후자가 실제로 더 현실적인 경로입니다. apps/rabbitmq.yaml 의 이름을 바꾸거나
    # 지우면 root Application(prune: true)이 rabbitmq Application을 prune하고,
    # 거기 붙은 resources-finalizer.argocd.argoproj.io 가 관리 대상 리소스를
    # 연쇄 삭제합니다. 이건 Prune=false 로는 막히지 않습니다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false

    # apps 네임스페이스의 User/Permission CR이 이 클러스터를 참조할 수 있게 허용.
    #
    # topology operator는 CR의 rabbitmqClusterReference.namespace 가 CR 자신의
    # 네임스페이스와 다르면 교차 참조로 보고, 대상 클러스터의 이 어노테이션에
    # 요청 네임스페이스가 있는지 확인합니다. 없으면 다음으로 거부합니다:
    #   "resource is not allowed to reference defined cluster reference.
    #    Check the namespace of the resource is allowed as part of the
    #    cluster's rabbitmq.com/topology-allowed-namespaces annotation"
    #
    # 쉼표 구분 목록이고 "*" 는 전체 허용입니다. 앱이 쓸 계정만 apps 로 빼야 해서
    # 필요한 네임스페이스만 명시합니다.
    #
    # 왜 이렇게 하는가: User CR이 만드는 자격증명 Secret은 User CR과 "같은"
    # 네임스페이스에 생성됩니다(operator user_controller.go: Namespace: user.Namespace).
    # Secret은 네임스페이스 스코프라 apps 의 파드가 default 의 Secret을 읽을 수
    # 없으므로, 계정 CR 자체를 apps 에 두어 Secret이 처음부터 거기 생기게 합니다.
    # PushSecret 이나 Reflector 같은 복사 장치가 아예 필요 없어집니다.
    rabbitmq.com/topology-allowed-namespaces: "apps"
spec:
  # 확정된 큐가 전부 type: quorum 이라 3노드로 갑니다. quorum은 과반수 합의로
  # 동작해서 1노드에서는 장애 내성이 0이고, 2노드는 한 대만 빠져도 과반이
  # 깨져서 쓰기가 멈춥니다. 3이 최소 의미 단위입니다.
  #
  # 중요: 이 값은 워커 노드 수와 함께 움직여야 합니다. 아래 anti-affinity가
  # required 라서, 노드가 3대 미만이면 남는 파드가 영구 Pending에 빠집니다.
  # platform/variables.tf 의 node_desired_size 와 항상 같이 보세요.
  replicas: 3

  # spec.image를 일부러 지정하지 않습니다.
  # 오퍼레이터는 자기 버전과 함께 테스트된 RabbitMQ 이미지를 기본값으로 갖고
  # 있고, 그 기본값은 오퍼레이터 바이너리에 박혀 있습니다. 여기서 임의의 태그를
  # 찍으면 오퍼레이터가 검증하지 않은 조합이 될 수 있어서, "RabbitMQ 버전은
  # 우리가 고정한 오퍼레이터 버전(v2.22.4)이 결정한다"로 둡니다.
  # 실제로 어떤 이미지가 선택됐는지는 배포 후 아래로 확인하세요:
  #   kubectl -n default get statefulset rabbitmq-server \
  #     -o jsonpath='{.spec.template.spec.containers[0].image}'

  # CRD 기본값이 604800초(1주일)이라 반드시 덮어써야 합니다.
  #
  # 오퍼레이터의 preStop 훅은 await_online_quorum_plus_one 을 기다립니다. 멤버
  # 하나가 이미 빠져 있으면 이 조건은 영영 만족되지 않으므로, 기본값 그대로면
  # 파드가 최대 일주일간 Terminating 에 머뭅니다. 아래 anti-affinity가 required
  # 이고 replicas == 노드 수라 여유 노드가 없어서, "노드 하나가 죽어 파드가
  # Pending → 다른 파드를 재시작" 같은 흔한 상황에서 바로 이 덫에 걸립니다.
  #
  # EKS 관리형 노드그룹 업그레이드는 노드당 축출 타임아웃이 15분이라, 기본값을
  # 두면 업그레이드가 PodEvictionFailure 로 실패합니다. 10분으로 잡아 그 안에
  # 확실히 끝나게 합니다 — 정상 종료에는 충분하고, 병적인 경우는 여기서 끊깁니다.
  #
  # 노드 정비 절차: 한 번에 한 대씩만 drain 하고, 다음 노드로 넘어가기 전에
  #   kubectl -n default get pod -l app.kubernetes.io/name=rabbitmq
  # 로 3개가 모두 Running 인지 확인하세요.
  terminationGracePeriodSeconds: 600

  persistence:
    # platform 스택이 만드는 gp3 StorageClass. WaitForFirstConsumer라서
    # 파드가 스케줄된 AZ에 맞춰 EBS 볼륨이 생성됩니다.
    #
    # 주의: 이 5Gi는 노드당 "모든 큐가 공유하는" 용량입니다. DLQ가 무한히 쌓이면
    # 여기가 차고, RabbitMQ의 disk_free_limit 알람이 걸리면 브로커가 살아있는
    # 큐까지 포함해 모든 발행을 차단합니다. 그래서 30-queues.yaml 의 DLQ에
    # x-max-length-bytes 상한을 걸어두었습니다.
    storageClassName: gp3
    storage: 5Gi

  # 메모리 limit이 곧 알람 임계를 결정합니다. cluster operator가 이 값으로
  # total_memory_available_override_value 를 세우고, RabbitMQ가 그 값에
  # vm_memory_high_watermark 비율을 곱한 지점에서 메모리 알람을 겁니다.
  # 알람이 걸리면 그 노드는 "모든" 발행을 차단하므로 백엔드까지 멈춥니다.
  #
  # 비율은 RabbitMQ 버전에 따라 다릅니다 — 4.x 기본값은 0.6 이고 그 이전은
  # 0.4 였습니다. 위에서 spec.image 를 일부러 비워 버전을 오퍼레이터에 맡기고
  # 있으므로, 여기 특정 수치를 사실로 적지 않습니다. 4.x 기준이면 2Gi × 0.6
  # 이라 대략 1.2GiB 지점입니다. 배포 후 실제 값으로 확인하세요:
  #   kubectl -n default exec rabbitmq-server-0 -- \
  #     rabbitmq-diagnostics memory_breakdown
  #   kubectl -n default exec rabbitmq-server-0 -- \
  #     rabbitmq-diagnostics status | grep -i "memory high watermark"
  #
  # 오퍼레이터 기본 limits 도 2Gi 라 그 선에 맞췄습니다. 이 값을 낮추면 알람
  # 지점이 비례해서 내려가므로 함부로 줄이지 마세요.
  #
  # requests < limits 라 QoS는 Burstable 입니다. 노드 메모리 압박 시 축출
  # 대상이 될 수 있으니, 운영에서 문제가 되면 requests를 limits와 같게 올려
  # Guaranteed로 바꾸세요 (대신 노드당 2Gi가 예약되어 스케줄 여유가 줄어듭니다).
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

  affinity:
    podAntiAffinity:
      # 노드 3대 확보(platform/variables.tf 의 node_desired_size = 3)에 맞춰
      # required 로 둡니다. 멤버 3개가 1:1:1로 흩어져야 한 노드가 빠져도 2/3으로
      # 과반이 유지됩니다. preferred 로 두면 스케줄러 사정에 따라 2개가 한 노드에
      # 몰릴 수 있고, 그러면 3중화의 의미가 사라집니다.
      #
      # 대가: 노드 수와 파드 수가 같으므로 노드를 drain하면 그 파드는 갈 곳이 없어
      # Pending에 머뭅니다. 남은 2개로 과반은 유지되니 서비스는 계속되고, 노드가
      # 돌아오면 자동 복귀합니다. 노드를 2대로 되돌릴 거라면 이 블록을 preferred로
      # 낮추고 replicas 도 함께 조정해야 세 번째 파드가 영구 Pending에 빠지지 않습니다.
      #
      # ⚠️ 이 구성이 사는 것은 "노드 장애 내성"까지이고 "AZ 장애 내성"은 아닙니다.
      #
      # network 스택의 AZ가 2개(ap-northeast-2a, 2c)뿐이라 노드 3대는 AZ 기준으로
      # 2:1로 배치됩니다. topologyKey가 kubernetes.io/hostname 이므로 호스트 단위
      # 분산만 보장되고, 결과는 이렇습니다:
      #
      #   노드 1대 사망      → 2/3 유지, quorum 정상, 서비스 계속
      #   AZ-a 전체 장애     → 3중 2 상실, quorum 붕괴, 모든 quorum 큐 쓰기 중단
      #
      # 게다가 NAT Gateway도 AZ-a에 1개뿐이고 rt-app-a / rt-app-c 가 둘 다 그것을
      # 가리킵니다(network/vpc.tf). AZ-a가 죽으면 quorum이 깨지는 동시에 살아남은
      # AZ-c 노드의 아웃바운드까지 끊깁니다.
      #
      # 의도적인 선택입니다. AZ 이중화를 하려면 network 스택에 세 번째 AZ와 서브넷
      # 3세트를 추가하고 NAT도 AZ별로 둬야 하는데(NAT 비용 3배), 시연/테스트 규모
      # 에서는 그 값이 사는 것보다 비쌉니다. "3중화했으니 AZ 장애도 괜찮다"고
      # 오해하지 않도록 여기 명시해 둡니다.
      #
      # ⚠️ 아래 레이블 값 "rabbitmq" 는 이 파일 맨 위 metadata.name 과 같아야
      # 합니다. 오퍼레이터가 파드에 app.kubernetes.io/name = <클러스터 이름>
      # 으로 레이블을 달기 때문입니다.
      #
      # 클러스터 이름만 바꾸고 여기를 안 고치면 셀렉터가 0개 파드에 매칭되고,
      # required anti-affinity 가 아무 제약 없이 자동 충족되어 3개 멤버가 한
      # 노드에 몰릴 수 있습니다. 파드는 전부 Running, Pending 도 없고
      # Application 도 초록이라 아무 신호가 없습니다 — 노드 하나가 죽어서
      # quorum이 깨질 때까지 알 수 없고, 그때는 이미 늦습니다.
      # 이름을 바꿀 일이 생기면 metadata.name 과 이 값을 반드시 함께 바꾸세요.
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
